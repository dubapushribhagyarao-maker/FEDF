<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        input {
            width: 45%;
            padding: 18px;
            font-size: 22px;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
        }

        button {
            width: 80%;
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: #667eea;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #4c5fd5;
        }

        .output {
            margin-top: 35px;
            padding: 25px;
            min-height: 250px;
            border-radius: 15px;
            background-color: #f2f4ff;
            border: 2px solid #667eea;
        }

        .output h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .result {
            font-size: 24px;
            line-height: 2;
            text-align: left;
            padding-left: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Arithmetic Operations</h1>

        <div class="input-box">
            <input type="number" id="num1" placeholder="First Number">

            <input type="number" id="num2" placeholder="Second Number">
        </div>

        <button onclick="calculate()">Calculate</button>

        <div class="output">

            <h2>Output</h2>

            <div class="result" id="result">
                Enter two numbers and click Calculate
            </div>

        </div>

    </div>

    <script>
        function calculate() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let addition = a + b;
            let subtraction = a - b;
            let multiplication = a * b;

            let division;
            let modulus;

            if (b !== 0) {
                division = a / b;
                modulus = a % b;
            } else {
                division = "Cannot divide by zero";
                modulus = "Cannot divide by zero";
            }

            document.getElementById("result").innerHTML =
                "Addition : " + addition + "<br>" +
                "Subtraction : " + subtraction + "<br>" +
                "Multiplication : " + multiplication + "<br>" +
                "Division : " + division + "<br>" +
                "Modulus : " + modulus;
        }
    </script>

</body>
</html>
